services:
  postgres:
    image: postgres:16-alpine
    container_name: yuheng-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yuheng
      POSTGRES_PASSWORD: yuheng123
      POSTGRES_DB: yuheng
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuheng -d yuheng"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
