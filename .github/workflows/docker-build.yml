name: Build Native Multi-Arch Docker Image

on:
  push:
    branches: [main, build]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: formaxcn/yuheng

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_id: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_id: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    outputs:
      base_tag: ${{ steps.vars.outputs.base_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set docker tag
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "base_tag=sha-${GITHUB_SHA}" >> $GITHUB_OUTPUT
          else
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            echo "base_tag=${TIMESTAMP}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        run: |
          FULL_TAG=${{ steps.vars.outputs.base_tag }}-${{ matrix.platform_id }}
          docker build --platform ${{ matrix.platform }} \
            --build-arg GITHUB_SHA=${GITHUB_SHA} \
            -t $REGISTRY/$IMAGE_NAME:${FULL_TAG} .
          docker push $REGISTRY/$IMAGE_NAME:${FULL_TAG}

  manifest:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          BASE_TAG=${{ needs.build.outputs.base_tag }}

          # Determine target tags
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            # Main branch: push :latest tag
            TARGET_TAG="latest"
          else
            # Build branch: push timestamp tag
            TARGET_TAG=${BASE_TAG}
          fi

          docker manifest create $REGISTRY/$IMAGE_NAME:${TARGET_TAG} \
            $REGISTRY/$IMAGE_NAME:${BASE_TAG}-linux-amd64 \
            $REGISTRY/$IMAGE_NAME:${BASE_TAG}-linux-arm64

          docker manifest annotate \
            $REGISTRY/$IMAGE_NAME:${TARGET_TAG} \
            $REGISTRY/$IMAGE_NAME:${BASE_TAG}-linux-amd64 \
            --os linux --arch amd64

          docker manifest annotate \
            $REGISTRY/$IMAGE_NAME:${TARGET_TAG} \
            $REGISTRY/$IMAGE_NAME:${BASE_TAG}-linux-arm64 \
            --os linux --arch arm64

          docker manifest push $REGISTRY/$IMAGE_NAME:${TARGET_TAG}
